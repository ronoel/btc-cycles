name: Update on-chain data

on:
  schedule:
    # 06:00 UTC: FRED daily series post with a ~1 business-day lag, BGeometrics rolls
    # over shortly after UTC midnight, so this run is the one that keeps `updated`
    # fresh through the European and US morning.
    - cron: '0 6 * * *'
    # 19:00 UTC: SoSoValue does NOT have the previous US session's ETF flows by 06:00.
    # Measured Aug 21, 2026: the 06:10 run got data through Aug 19, while a manual pull
    # at 17:40 the same day already had Aug 20 (+$606M). The 06:00-only schedule was
    # therefore structurally a day behind on ETF flows -- and `etf.d20` is the published
    # arbiter for one leg of the pre-registered falsifier #6 trigger, so the page showed
    # that leg at +$0.94B, under its +$1.5B bar, after the source had cleared it.
    # Additive rather than a move: the on-chain and macro sections read identically at
    # both hours, so this can only add freshness. Commits only when something changed.
    - cron: '0 19 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      # v7 for both: v4/v5 target Node 20, which the runners now force onto Node 24
      # and will eventually stop supporting. checkout v6 moved the persisted
      # credential into a separate file — the "Commit and push" step below relies on
      # it, so verify that step after any future bump of this action.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # All sources are keyless; the token only lifts bitcoin-data.com's
      # anonymous rate limit (10 req/h) and may widen the history window.
      # The script never fails the build — a source that errors keeps its
      # previous value and is listed in data.json's `stale` array.
      - name: Build data.json + history.json
        env:
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
        run: python3 scripts/build_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update on-chain data $(date -u +%Y-%m-%d)"
            git push
          fi

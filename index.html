@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap');
/* Depth-chart palette: price falling = deeper water. Buy zones are depth bands; the
   only warm colour is bitcoin orange, reserved for "now". */
:root{--paper:#F1F5F8;--sheet:#FFFFFF;--ink:#10243A;--ink2:#46596C;--ink3:#7D90A3;--rule:#D6DFE7;
  --sea1:#DDEBF3;--sea2:#BBD4E4;--sea3:#8FB2CA;--btc:#E8830C;--on:#0B7A69;--part:#A86A12;--off:#8A9BAC;
  --c1:#5B7FA6;--c2:#2F9C83;--c3:#8C79C9;--c4:#E8830C;--bad:#C2413A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0C1A28;--sheet:#11233A;--ink:#E6EEF5;--ink2:#A9BACA;--ink3:#6F849A;--rule:#22384F;
  --sea1:#14304A;--sea2:#1B4262;--sea3:#26587E;--btc:#F7931A;--on:#3CC2A8;--part:#E2A84B;--off:#6F849A;
  --c1:#7FA3CB;--c2:#4CC3A5;--c3:#A897E3;--c4:#F7931A;--bad:#F0837C;color-scheme:dark}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 100;background:var(--paper);color:var(--ink);
  line-height:1.55;font-size:16px;font-variant-numeric:tabular-nums}
a{color:inherit;text-underline-offset:3px}
a:focus-visible,button:focus-visible,.tip:focus-visible{outline:2px solid var(--btc);outline-offset:2px}
.ctn{max-width:1120px;margin:0 auto;padding:28px 24px 48px}
@media (max-width:640px){.ctn{padding:20px 16px 40px}}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.hdr h1{font-size:1.15rem;font-weight:700;font-stretch:112%;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:.95rem;max-width:60ch;margin-top:2px}
.lsel{display:flex;gap:2px}
.lbtn{background:none;border:0;color:var(--ink3);font:inherit;font-size:.85rem;padding:4px 8px;border-radius:4px;cursor:pointer}
.lbtn.on{color:var(--ink);background:var(--sea1)}.lbtn:hover{color:var(--ink)}
.sbar{display:flex;align-items:center;gap:8px;margin:14px 0 28px;font-size:.85rem;color:var(--ink2);flex-wrap:wrap}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--ink3)}
.sdot.ok{background:var(--on)}.sdot.err{background:var(--bad)}.sdot.ld{background:var(--btc);animation:pls 1s infinite}
@keyframes pls{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sdot.ld{animation:none}}
.stxt b{color:var(--ink);font-weight:600}
.rinfo{margin-left:auto;color:var(--ink3);display:flex;gap:6px;align-items:center}
.rdot{width:5px;height:5px;border-radius:50%;background:var(--on);opacity:.5}

/* hero: verdict on the left, the price map on the right */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start;padding-bottom:40px;border-bottom:1px solid var(--rule)}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:28px}}
.v-l{color:var(--ink2);font-size:.9rem}
.v-stage{font-size:clamp(3rem,8vw,5.4rem);font-weight:800;font-stretch:125%;line-height:.95;letter-spacing:-.035em;margin:6px 0 10px}
.v-fam{color:var(--ink2);font-size:.95rem}
.v-act{font-size:1.35rem;font-weight:500;font-stretch:96%;line-height:1.35;margin:26px 0 24px;max-width:28ch}
.v-facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
@media (max-width:480px){.v-facts{grid-template-columns:1fr}}
.v-f .k{color:var(--ink3);font-size:.82rem}
.v-f .n{font-size:1.5rem;font-weight:700;font-stretch:112%;line-height:1.2}
.v-f .s{color:var(--ink2);font-size:.88rem;line-height:1.4}
.v-next{margin-top:26px;font-size:.92rem}
.v-next ul{list-style:none;margin-top:6px}
.v-next li{display:flex;gap:12px;padding:5px 0;border-top:1px solid var(--rule)}
.v-next li span:first-child{color:var(--ink3);min-width:9.5em;flex-shrink:0}
.pmap{width:100%;height:auto;display:block}
.pmap text{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.pm-b0{fill:var(--sea1)}.pm-b1{fill:var(--sea2)}.pm-b2{fill:var(--sea3)}
.pm-bt{fill:var(--ink);font-size:15px;font-weight:700;font-stretch:110%}.pm-br{fill:var(--ink2);font-size:13px}
.pm-lv{stroke:var(--ink3);stroke-dasharray:3 4}.pm-lead{stroke:var(--ink3)}.pm-axis{stroke:var(--ink);stroke-width:1.5}
.pm-p{fill:var(--ink);font-size:14px;font-weight:600;font-stretch:112%}.pm-n{fill:var(--ink2);font-size:11.5px}.pm-ath{fill:var(--ink3);font-size:12px}
.pm-now{stroke:var(--btc);stroke-width:3}.pm-dot{fill:var(--btc);stroke:var(--paper);stroke-width:3}.pm-nt{fill:var(--btc);font-size:20px;font-weight:800;font-stretch:115%}
.pm-cap{color:var(--ink3);font-size:.8rem;margin-top:6px}

/* sections */
.sec{padding:40px 0;border-bottom:1px solid var(--rule)}
.sec:last-of-type{border-bottom:0}
.sec h2{font-size:1.45rem;font-weight:700;font-stretch:112%;letter-spacing:-.015em;margin-bottom:6px}
.sec .lead{color:var(--ink2);max-width:68ch;margin-bottom:20px}
.asof{color:var(--ink3);font-size:.8rem;font-weight:400;font-stretch:100%;margin-left:10px;letter-spacing:0}
.stale{color:var(--part);font-size:.8rem;font-weight:500;margin-left:10px}
.nt{color:var(--ink3);font-size:.85rem;max-width:72ch;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:28px}}
.subsec{margin-top:32px;max-width:760px}
.subsec h3{font-size:1.05rem;font-weight:700;font-stretch:108%}
.subsec .nt{margin:2px 0 10px}
.sec h2.next{margin-top:36px}
.cinn.tall{height:440px}.cinn.mid{height:360px}

/* status marks */
.st{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap}
.st::before{content:'';width:9px;height:9px;border-radius:50%;border:2px solid var(--off)}
.st.on::before{background:var(--on);border-color:var(--on)}
.st.part::before{background:linear-gradient(90deg,var(--part) 50%,transparent 50%);border-color:var(--part)}
.st.on{color:var(--on)}.st.part{color:var(--part)}.st.off{color:var(--ink3)}

/* buy-now trigger legs */
.legs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink)}
@media (max-width:760px){.legs{grid-template-columns:1fr}}
.leg{padding:16px 20px 16px 0}
.leg+.leg{padding-left:20px;border-left:1px solid var(--rule)}
@media (max-width:760px){.leg+.leg{padding-left:0;border-left:0;border-top:1px solid var(--rule)}}
.leg .q{font-weight:600;margin-bottom:6px}
.leg .r{color:var(--ink2);font-size:.9rem;margin-top:4px}
.legs-n{margin-top:14px;font-size:.92rem;color:var(--ink2)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:500;color:var(--ink3);font-size:.82rem;padding:8px 12px 8px 0;border-bottom:1px solid var(--ink3)}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.num{white-space:nowrap}
tr.hit td{background:var(--sea1)}
.live{font-size:.72rem;font-weight:600;color:var(--on);margin-left:6px;letter-spacing:.02em}
.rd{color:var(--bad)}

/* families */
.fams{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:22px;border-top:2px solid var(--ink)}
@media (max-width:760px){.fams{grid-template-columns:1fr 1fr}}
.fam{padding:12px 16px 12px 0}
.fam .fn{font-weight:600}
.fam .fv{color:var(--ink2);font-size:.88rem}
.fam.lit .fn::after{content:' ●';color:var(--on)}
.fam-g{color:var(--ink3);font-size:.8rem;padding:14px 0 4px}
td .rr{color:var(--ink2)}

/* events */
.ev-tbl td{padding-top:8px;padding-bottom:8px}
.ev-tbl td:first-child{white-space:nowrap;color:var(--ink2);width:12.5em}
.ev-tbl tr.soon td:first-child{color:var(--ink);font-weight:600}
.ev-tbl td b{font-weight:600;display:block}
.ev-tbl td span.w{color:var(--ink2);font-size:.88rem}
.ev-cd{display:block;color:var(--ink3);font-size:.8rem;font-weight:400}

/* macro */
.eff{font-size:.82rem;white-space:nowrap}
.eff.h{color:var(--bad)}.eff.t{color:var(--on)}.eff.m{color:var(--ink3)}

/* estimates */
.est{list-style:none}
.est li{padding:10px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 16px}
.est .m{color:var(--ink2);font-size:.9rem}
.est .v{font-weight:700;font-stretch:110%;text-align:right}
.est .d{grid-column:1/-1;color:var(--ink3);font-size:.85rem}
.est-sum{margin-top:12px;font-size:.92rem;color:var(--ink2)}

/* falsifiers */
.fal{list-style:none;max-width:76ch}
.fal li{padding:9px 0;border-top:1px solid var(--rule)}

/* charts */
.cwrap{position:relative}
.cinn{position:relative;width:100%}
#ch1{cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 10px}
.legi{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink2);cursor:pointer;background:none;border:0;font-family:inherit;padding:2px 0}
.legi.off{opacity:.35}
.legsq{width:14px;height:3px;border-radius:2px}
.cp{display:none;margin-top:14px}
.cp.show{display:block}
.cp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cp-title{font-weight:600}
.cp-close{background:none;border:0;color:var(--ink3);font:inherit;cursor:pointer;font-size:1.2rem}
.cp-grid{display:grid;grid-template-columns:auto repeat(4,1fr);font-size:.88rem}
.cp-hdr,.cp-cell{padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
.cp-hdr{font-weight:600}
.cp-na{color:var(--ink3)}
.cp-buy{color:var(--on)}.cp-sell{color:var(--bad)}.cp-neut{color:var(--ink2)}
.cp-hint{color:var(--ink3);font-size:.85rem;margin-top:8px}

/* tooltips */
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--ink3);color:var(--ink3);
  font-size:.68rem;margin-left:6px;cursor:help;position:relative;vertical-align:1px}
.tip .tt{display:none;position:absolute;left:50%;top:22px;transform:translateX(-50%);width:min(300px,80vw);background:var(--ink);color:var(--paper);
  font-size:.82rem;font-weight:400;line-height:1.45;padding:10px 12px;border-radius:6px;z-index:20;text-align:left}
.tip:hover .tt,.tip:focus .tt{display:block}

/* exchanges */
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;margin-bottom:20px}
.cmp-card{padding:14px 0;border-top:2px solid var(--ink)}
.cmp-name{font-weight:700;font-stretch:110%;font-size:1.1rem}
.cmp-type{color:var(--ink3);font-size:.85rem;margin-bottom:8px}
.cmp-row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:3px 0}
.cmp-k{color:var(--ink3)}
.cmp-link{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-weight:600;color:var(--ink);font-size:.9rem}
.cmp-link svg{width:14px;height:14px}
.cmp-note{border-top:1px solid var(--rule);padding-top:10px}
.cmp-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:20px;font-size:.88rem;color:var(--ink2)}
.cmp-note b{color:var(--ink)}

/* footer */
.ftr{padding-top:32px;color:var(--ink3);font-size:.85rem;display:grid;gap:10px}
.ftr a{color:var(--ink2)}
.don{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.don-box{display:inline-flex;gap:8px;align-items:center}
.don-qr{width:84px;height:84px;background:#fff;padding:4px;border-radius:4px}
.don-cp{background:none;border:1px solid var(--rule);color:var(--ink2);font:inherit;font-size:.8rem;padding:2px 8px;border-radius:4px;cursor:pointer}
.ev-more{display:block;margin:4px 0 14px;background:none;border:1px solid var(--ink3);color:var(--ink);font:inherit;font-size:.88rem;padding:6px 12px;border-radius:4px;cursor:pointer}
.ev-more:hover{background:var(--sea1)}
</style>
</head>

o gate; Brent traded near $100 on Oct 1."],"fomc_min":["FOMC minutes (Sep 15–16 meeting)","How wide the support for a second hike was behind the 12–0 vote — the input the October pricing lacks. Date derived from the Fed’s practice of publishing three weeks after the decision."],"ecb":["ECB rate decision","The day after the FOMC. Moves the euro side of the dollar, which sits above its 200-day in the macro composite."],"boj":["Bank of Japan decision + Outlook Report (Oct 29–30)","A hike strengthens the yen and squeezes carry trades — the mechanism behind the August 2024 crypto flush."],"deribit2":["Monthly options expiry (Deribit)","About 35% of Deribit’s BTC open interest, ~$11B notional; max pain ~$78–79K and the largest single strike the $95K call (reported Oct 8)."],"anthropic_day":["Anthropic pre-IPO investor day","Institutional investors meet management in San Francisco (Bloomberg, Oct 1, via secondary coverage). Not the roadshow, and still no public S-1 on EDGAR (Oct 2) — it has to be public 15 days before a roadshow starts."],"anthropic_px":["Anthropic IPO pricing (reported)","Final price and allocation, the night before the first trade (press; not in the prospectus). SpaceX analog: BTC bounced from the roadshow low into pricing."],

"spx_lock":["SpaceX final lock-up expiry (reported)","The last 180-day release of the June IPO (press; prospectus not read). Supply of the largest 2026 listing, the day before the FOMC."],"anthropic_rs":["Anthropic IPO roadshow","Launched Nov 10: range $70–78 for 825M shares, unchanged in the filings (EDGAR, Nov 12); press reports the book several times covered and talk of pricing above the range. At the same point of SpaceX’s calendar BTC was 17–21% under the S-1 close; this time ~8% (Nov 11 close)."],"ndx_ant":["Nasdaq-100 fast entry for Anthropic (derived)","15 trading days from a Nov 19 debut (Thanksgiving closed): index funds buy at the Dec 10 close. Moves with the listing date."],"clock":["Cycle clock passes the ~370-day average","Days since the Oct 6, 2025 ATH reach the C2/C3 average ATH-to-bottom span. A timing marker, not a trigger."],"cpi_sep":["September CPI (BLS)","August core CPI turned a September hike from a coin-flip into the priced case."],"ppi_sep":["September PPI (BLS)","August PPI ran 5.4% y/y with diesel +24%: where the oil shock shows up first."],"msci_dec":["MSCI results on non-operating companies","Announced on or before this date. An exclusion would force passive selling of Strategy and peers — a flow shock into the company holding ~845K BTC."],"sec_cmt":["SEC “Regulation Crypto Assets” comment period closes","File S7-2026-27. Slow-moving: final rules come months later."],"fomc_oct":["FOMC decision (Oct 27–28)","No dot plot. The Sep 16 dots put one more hike in 2026; Polymarket priced a hike at 45.5% on Sep 17, ~65% on Sep 27 and 16.5% on Oct 6 and Oct 11, after September payrolls of +29K; 27.5% on Oct 15 after core CPI, 12.5% on Oct 22."],"gdp_q3":["Q3 GDP (advance) + September PCE (BEA)","Growth and inflation on the same morning, the day after the FOMC."],"mtgox":["Mt. Gox repayment deadline (extended)","Moved a year from Oct 31, 2026. The trustee still holds ~34,400 BTC; wallet moves before past deadlines hit price."],"msci_eff":["MSCI deletions take effect","Strategy leaves the MSCI USA Index at this close (MSCI list, Nov 11): index funds sell MSTR shares, not BTC."],"midterms":["US midterm elections","The next Congress decides whether the market-structure bill that failed cloture on Sep 15 comes back in 2027."],"refund":["Treasury quarterly refunding","Coupon sizes and buyback plans drive long-end yields and liquidity — this summer the Treasury, not the Fed, moved liquidity."],"nfp_oct":["October payrolls (BLS)","First labour print after the October FOMC."],"capend":["Projected end of the capitulation phase","Derived from C2/C3 phase durations. If a lower low is still coming, the precedents place it around here."],"cpi_oct":["October CPI (BLS)","Inflation input for the December dot plot."],"ppi_oct":["October PPI (BLS)","Producer-price pass-through of the oil shock."],"pce_oct":["October PCE + Q3 GDP second estimate (BEA)","Last PCE before the December FOMC."],"wk60":["End of the projected bottom window (week 60)","A bottom not made by this date falls outside the cycle-derived window."],"nfp_nov":["November payrolls (BLS)","Last labour print before the December FOMC."],"fomc_dec":["FOMC decision + dot plot (Dec 8–9)","The rate path for 2027."],"cr":["US government funding expires","The continuing resolution runs through Dec 11; a shutdown would delay the data releases above."],"retarget3":["Bitcoin difficulty retarget","Estimated +4.4% (mempool.space, Oct 11) after −0.03% on Oct 3 and +4.16% on Sep 19. Difficulty rising again while the price stalls is what squeezes miner margins — the input behind Puell and Hash Ribbons."],"ism_oct":["ISM services PMI, October","September’s prices-paid index printed 74.0 with the headline at 54.9: the services side of the inflation case for a December hike. Date from ISM’s third-business-day rule."],"deribit3":["Monthly options expiry (Deribit)","Last Friday of November, the day after Thanksgiving — thin US liquidity."],"cpi_nov":["November CPI (BLS)","Lands the day after the December FOMC decision, so the dot plot is written without it."],"ppi_nov":["November PPI (BLS)","Producer-price pass-through of the oil shock."],"ecb_dec":["ECB rate decision","Last ECB meeting of the year; moves the euro side of the dollar, which sits above its 200-day in the macro composite."],"boj_dec":["Bank of Japan decision (Dec 17–18)","A hike strengthens the yen and squeezes carry trades — the mechanism behind the August 2024 crypto flush."],"pce_nov":["November PCE + Q3 GDP third estimate (BEA)","Last inflation print of the year, in holiday-thin markets."],"deribit4":["Quarterly and year-end options expiry (Deribit)","The largest expiry of the quarter, on Christmas Day."],"fomc_jan":["FOMC decision (Jan 26–27, 2027)","First meeting of 2027; no dot plot."],"retarget4":["Bitcoin difficulty retarget","Estimated +5.86% (mempool.space, Oct 29) after +5.92% on Oct 16 — a second large rise in a row while the price stalls squeezes miner margins, the input behind Puell and Hash Ribbons."],"binance_wd":["Binance withdrawals restart (company target)","Paused since Oct 29 after the ~$6.3B theft. Binance said within 40 hours at 14:34 UTC on Oct 30, after earlier estimates of 48 and 45 (press). A missed restart is the first sign of the exchange-failure path."],"binance_por":["Binance proof-of-reserves report (promised)","Promised by Monday after the Oct 29 theft (co-CEO Teng, press). A missing or partial report keeps the exchange-failure path open."],"ism_mfg":["ISM manufacturing PMI, October","The flash manufacturing PMI reached a 53-month high on Oct 23: the goods side of the inflation case for a December hike. Date from ISM’s first-business-day rule."],"retail_oct":["October retail sales (Census)","First consumer read after the Nov 5 equity rout; a strong print adds to the December hike case."],"nvda_q3":["Nvidia Q3 results","The next big test of the AI trade, now with a report (Nov 11) that the board may oust the CEO. After the US close."],"retarget5":["Bitcoin difficulty retarget","Estimated −6.93% with the epoch 88.3% through, ~20:30 UTC (mempool.space, Nov 12); the last two printed +5.92% and +5.54%."],"coin_q3":["Coinbase Q3 earnings","After the US close, the day after the FOMC. Trading volume and custody balances are a read on retail and institutional demand."],"opec2":["OPEC+ monthly meeting","The voluntary-cut group held November output flat on Oct 4. Oil is the route to the CPI-reacceleration scenario behind the macro gate."],"msci_list":["MSCI decision on Strategy and Metaplanet","The November review (~22:00 UTC) says whether they leave the indexes. An exclusion forces passive selling of the largest corporate BTC holder."],"fomc_min2":["FOMC minutes (Oct 27–28 meeting)","How the committee read September’s hike and the oil shock. Date and time from the Fed’s November calendar."],"nfp_dec":["December payrolls (BLS)","First labour print after the December FOMC."],"cpi_dec":["December CPI (BLS)","Last CPI before the January FOMC."],"ppi_dec":["December PPI (BLS)","Producer-price pass-through of the oil shock."],"boj_jan":["Bank of Japan decision (Jan 21–22, 2027)","A hike strengthens the yen and squeezes carry trades — the mechanism behind the August 2024 crypto flush."],"ecb_feb":["ECB rate decision","First ECB meeting of 2027; moves the euro side of the dollar, which sits in the macro composite."],"nfp_jan":["January payrolls (BLS)","Carries the annual benchmark revision of the payroll series."],"cpi_jan":["January CPI (BLS)","Inflation input for the March dot plot."],"ppi_jan":["January PPI (BLS)","Producer-price pass-through of the oil shock."],"nfp_feb":["February payrolls (BLS)","Last labour print before the March FOMC."],"cpi_feb":["February CPI (BLS)","Last CPI before the March dot plot."],"ppi_feb":["February PPI (BLS)","Producer-price pass-through of the oil shock."],"fomc_mar":["FOMC decision + dot plot (Mar 16–17, 2027)","First dot plot of 2027: the rate path for the rest of the year."],"ecb_mar": function t(k){return L[lang]?.[k]||L.en[k]||k}
// String.replace with a string pattern substitutes only the FIRST match, so a key that
// used the same placeholder twice rendered a literal "{1}" the second time (found
// Aug 24, 2026 in th_p). split/join replaces every occurrence and, unlike replace(),
// gives no special meaning to $ sequences in the value \u2014 which matters here because
// several of these values are prices like $77,448.
function tf(k,...a){let s=t(k);a.forEach((v,i)=>{s=s.split('{'+i+'}').join(v)});return s}
const LOC={en:'en-US',pt:'pt-BR',es:'es-ES'};

// ---- Bottom-checklist scoring -------------------------------------------------
// Weights are expert judgement over N=3 bear markets, which is too small to fit 15
// parameters against. They are kept because the alternative (equal weights) is also
// a choice, and published alongside the equal-weight score so the reader can see how
// little the choice matters — at the Nov 2022 bottom the two agreed to within 1pt.
// Must sum to 100.
const BS_W={rp:9,nupl:9,mvrv:6,sopr:5,ma200w:10,dd55:12,puell:6,hash:6,lth:5,resv:3,cbp:3,fed:7,fund:7,sthmvrv:7,etf:5};
// Signals are grouped into four families because they are not independent: four of
// them are functions of realized cap, five read the same capitulation event. Scoring
// by family stops the correlated cluster from dominating either weighting scheme.
const BS_FAM={rp:'val',nupl:'val',mvrv:'val',sthmvrv:'val',
  sopr:'cap',dd55:'cap',ma200w:'cap',puell:'cap',hash:'cap',
  lth:'flow',resv:'flow',cbp:'flow',fund:'flow',etf:'flow',
  fed:'mac'};
const FAM_ORDER=['val','cap','flow','mac'];
const sv=s=>s==='on'?1:s==='part'?.5:0;

// A family "lights" on a STRICT majority of its signals being active, with a PARTIAL
// counting a half. Strict matters: with `>=`, a family whose signals are all merely
// PARTIAL sums to exactly half and would light with nothing actually active — which
// briefly had the banner reading BOTTOM ZONE on 2 of 15 active signals.
// The number of lit families is the headline state — an ordinal reading the evidence
// actually supports, unlike a percentage that reads like a probability.
function scoreRows(rows){
  const tw=rows.reduce((s,b)=>s+(BS_W[b.k]||0),0)||100;
  const expert=Math.round(rows.reduce((s,b)=>s+(BS_W[b.k]||0)*sv(b.st),0)/tw*100);
  const equal=Math.round(rows.reduce((s,b)=>s+sv(b.st),0)/rows.length*100);
  const fam={};
  FAM_ORDER.forEach(f=>{
    const r=rows.filter(b=>BS_FAM[b.k]===f);
    if(!r.length)return;
    const v=r.reduce((s,b)=>s+sv(b.st),0);
    fam[f]={n:r.length,on:r.filter(b=>b.st==='on').length,
      prt:r.filter(b=>b.st==='part').length,lit:v>r.length/2};
  });
  const lit=Object.values(fam).filter(f=>f.lit).length;
  return {expert,equal,fam,lit,
    act:rows.filter(b=>b.st==='on').length,
    prt:rows.filter(b=>b.st==='part').length,
    stage:lit>=4?3:lit>=3?2:lit>=2?1:0};
}

// ============ BINANCE API (no key needed) ============
async function fetchBinanceKlines(limit){
  try{
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=${limit}`);
    if(!r.ok)return[];
    const d=await r.json();
    return d.map(k=>({ts:k[0],close:parseFloat(k[4])}));
  }catch(e){return[]}
}
async function fetchBinancePrice(){
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const d=await r.json();return parseFloat(d.price);
  }catch(e){return null}
}
// Binance Futures funding rate (CORS enabled). Last 21 x 8h = 7 days
let fundingData=null;
async function fetchFunding(){
  try{
    const r=await fetch('https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=21');
    if(!r.ok)return null;
    const d=await r.json();
    if(!Array.isArray(d)||!d.length)return null;
    const vals=d.map(x=>parseFloat(x.fundingRate)).filter(v=>!isNaN(v));
    if(!vals.length)return null;
    const avg7d=vals.reduce((a,b)=>a+b,0)/vals.length;
    fundingData={avg7d};
    return fundingData;
  }catch(e){return null}
}

// Fetch full daily history from Binance (Aug 2017 to now, ~3000 days in 3 parallel requests)
let allDailyCloses=[];
async function fetchAllHistory(){
  const startMs=new Date('2017-08-01').getTime();
  const batchMs=999*86400000;
  const fetches=[];
  for(let s=startMs;s<Date.now();s+=batchMs){
    fetches.push(fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&startTime=${s}&limit=1000`)
      .then(r=>r.ok?r.json():[]).catch(()=>[]));
  }
  const batches=await Promise.all(fetches);
  const map=new Map();
  for(const batch of batches){
    for(const k of batch){map.set(k[0],parseFloat(k[4]))}
  }
  const sorted=[...map.entries()].sort((a,b)=>a[0]-b[0]);
  allDailyCloses=sorted;
  return sorted;
}

// Calculate indicators at a specific week relative to a cycle's ATH
function calcAtWeek(weekNum,cycleIdx){
  const cyc=CYCLE_ATHS[cycleIdx];
  if(!cyc.hasData)return null;
  const targetDate=new Date(cyc.athDate.getTime()+weekNum*7*86400000);
  const targetTs=targetDate.getTime();
  // Find the closest daily close at or before targetDate
  let endIdx=-1;
  for(let i=0;i<allDailyCloses.length;i++){
    if(allDailyCloses[i][0]<=targetTs)endIdx=i;
    else break;
  }
  if(endIdx<0)return null;
  // Need at least 350 prices for Pi Cycle
  const startIdx=Math.max(0,endIdx-400);
  const prices=allDailyCloses.slice(startIdx,endIdx+1).map(p=>p[1]);
  if(prices.length<50)return null;
  const cur=prices[prices.length-1];
  const dd=Math.round(((cur/cyc.ath)-1)*1000)/10;
  const result={price:cur,dd:dd};
  const ma200=calcMA(prices,200);
  if(ma200){result.mayer=Math.round(cur/ma200*100)/100;result.ma200pct=Math.round(((cur/ma200)-1)*100)}
  const ma111=calcMA(prices,111),ma350=calcMA(prices,350);
  if(ma350&&ma111)result.piCrossed=ma111>=ma350*2;
  const weekly=[];for(let i=0;i<prices.length;i+=7)weekly.push(prices[i]);weekly.push(cur);
  result.rsi=calcRSI(weekly,14);
  return result;
}

// ============ INDICATORS ============
function calcMA(prices,period){if(prices.length<period)return null;return prices.slice(-period).reduce((a,b)=>a+b,0)/period}
function calcRSI(prices,period){
  if(prices.length<period+1)return null;
  let g=0,l=0;
  for(let i=prices.length-period;i<prices.length;i++){const d=prices[i]-prices[i-1];if(d>0)g+=d;else l-=d}
  if(l===0)return 100;return Math.round(100-100/(1+g/l));
}

// ============ PROCESS BINANCE DATA ============
function processKlines(klines){
  const c4pre=[],c4postW=[{x:0,y:0}],c4postD=[{x:0,y:0}];
  for(const k of klines){
    const dt=new Date(k.ts),p=k.close;
    const w=wk(dt),fw=fwk(dt),dd=Math.round(((p/ATH)-1)*1000)/10;
    if(dt<ATHD){c4pre.push({x:w,y:dd})}
    else if(w>0){
      c4postD.push({x:Math.round(fw*100)/100,y:dd});
      c4postW.push({x:w,y:dd});
    }
  }
  const dedup=arr=>{const m=new Map();arr.forEach(p=>m.set(p.x,p.y));return[...m.entries()].map(([x,y])=>({x,y})).sort((a,b)=>a.x-b.x)};
  return{pre:dedup(c4pre),postW:dedup(c4postW),postD:c4postD.sort((a,b)=>a.x-b.x)};
}

      plugins:{legend:{display:false},tooltip:{...ttO(),callbacks:{title:i=>t('lw')+' '+Math.round(i[0].parsed.x*10)/10,label:c=>' '+c.dataset.label+': '+Math.round(c.parsed.y*10)/10+'%'}}}},
    plugins:[{id:'bz',beforeDatasetsDraw(c){const x=c.ctx,s=c.scales.x,y=c.scales.y;
      const yd=v=>y.getPixelForValue((v/ATH-1)*100);
      const x0=s.getPixelForValue(50),x1=s.getPixelForValue(60),y0=yd(57000),y1=yd(38000);
      x.save();
      x.fillStyle=TH.sea1;x.fillRect(x0,y0,x1-x0,y1-y0);
      x.strokeStyle=TH.sea3;x.setLineDash([5,4]);x.lineWidth=1;x.strokeRect(x0,y0,x1-x0,y1-y0);
      x.strokeStyle=TH.rule;x.setLineDash([3,4]);
      [57000,50000,44000,38000].forEach(p=>{const yy=yd(p);x.beginPath();x.moveTo(s.left,yy);x.lineTo(s.right,yy);x.stroke();x.fillStyle=TH.ink3;x.font='10px Archivo,sans-serif';x.textAlign='right';x.fillText('$'+(p/1000)+'K',s.right-4,yy-3)});
      x.setLineDash([]);x.fillStyle=TH.ink2;x.font='500 10px Archivo,sans-serif';x.textAlign='center';x.fillText(t('win_box'),(x0+x1)/2,y0-6);
      // Where each prior cycle actually bottomed, in weeks after its own ATH. The
      // shaded window is drawn from these three observations and nothing else, so
      // showing them makes the derivation visible instead of asserted.
      PRIOR_LOWS.forEach((p,ix)=>{const px2=s.getPixelForValue(p.w),
        ty=y.getPixelForValue(-22-ix*7),by=y.getPixelForValue(p.dd);
        x.beginPath();x.setLineDash([2,3]);x.moveTo(px2,ty+3);x.lineTo(px2,by);
        x.strokeStyle=COL[p.c]+'99';x.lineWidth=1;x.stroke();x.setLineDash([]);
        x.beginPath();x.arc(px2,by,3,0,Math.PI*2);x.fillStyle=COL[p.c];x.fill();
        x.font='10px Archivo,sans-serif';x.textAlign='center';
        x.fillText('C'+(p.c+1)+' w'+p.w,px2,ty)});
      x.restore()}},
    {id:'c',afterDraw(c){const w=wk(new Date()),x=c.ctx,s=c.scales.x,y=c.scales.y,p=s.getPixelForValue(w);x.save();x.beginPath();x.setLineDash([5,4]);x.strokeStyle=TH.ink3;x.lineWidth=1;x.moveTo(p,y.top);x.lineTo(p,y.bottom);x.stroke();x.setLineDash([]);x.fillStyle=TH.ink2;x.font='11px Archivo,sans-serif';x.textAlign='center';x.fillText(t('lw')+' '+w+' ('+t('ln')+')',p,y.top-6);x.restore()}},{id:'d',afterDatasetsDraw(c){const m=c.getDatasetMeta(3);if(m.hidden)return;const p=m.data[m.data.length-1];if(!p)return;const x=c.ctx;x.save();x.beginPath();x.arc(p.x,p.y,7,0,Math.PI*2);x.fillStyle=TH.btc;x.fill();x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fillStyle=TH.paper;x.fill();x.restore()}}]});
  bl('lg2',ch2);
}
// Price ticks only move cycle 4's last points: update the data in place instead of rebuilding both charts.
function updateCharts(){if(!ch1||!ch2)return rebuild();
  ch1.data.datasets[3].data=[...c4Pre,...c4PostW];ch2.data.datasets[3].data=c4PostD.length>2?c4PostD:c4PostW;
  ch1.update('none');ch2.update('none')}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rebuild);

// ============ REFRESH & INIT ============
async function refresh(){
  const pr=await fetchBinancePrice();if(!pr)return;
  // dailyK feeds leg 1 (last completed Sunday close): pull the last candles again once a new UTC day starts
  const d0=new Date();if(dailyK.length&&dailyK[dailyK.length-1].ts<Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate())){
    const k=await fetchBinanceKlines(14);if(k.length){const m=new Map(dailyK.map(x=>[x.ts,x]));k.forEach(x=>m.set(x.ts,x));dailyK=[...m.values()].sort((a,b)=>a.ts-b.ts)}}
  lastPr=pr;const dd=Math.round(((pr/ATH)-1)*1000)/10,w=wk(new Date()),fw=fwk(new Date());
  const eiW=c4PostW.findIndex(p=>p.x===w);if(eiW>=0)c4PostW[eiW].y=dd;else{c4PostW.push({x:w,y:dd});c4PostW.sort((a,b)=>a.x-b.x)}
  c4PostD.push({x:Math.round(fw*100)/100,y:dd});
  localStorage.setItem(SK,JSON.stringify({pre:c4Pre,postW:c4PostW,postD:c4PostD,lastPrice:pr,lastUpdate:Date.now()}));
  ss('ok',tf('so',$(pr),Math.round(dd)));updateUI();updateCharts();
}
let ctr=60;setInterval(()=>{ctr--;document.getElementById('rDot').style.opacity=ctr%2===0?'0.7':'0.3';if(ctr<=0){ctr=60;refresh()}},1000);

(async function(){
  lang=detectLang();applyI18n();
  ss('ld',t('sf'));

  // klines, data.json and funding are independent: fetch them together (each catches its own failure)
  const [klines]=await Promise.all([fetchBinanceKlines(1000),fetchOnChainData(),fetchFunding()]);

  if(klines.length>0){
    const d=processKlines(klines);
    c4Pre=d.pre;c4PostW=d.postW;c4PostD=d.postD;
    lastPr=klines[klines.length-1].close;
    const dd=Math.round(((lastPr/ATH)-1)*100);

    dailyK=klines;

    localStorage.setItem(SK,JSON.stringify({pre:c4Pre,postW:c4PostW,postD:c4PostD,lastPrice:lastPr,lastUpdate:Date.now()}));
    ss('ok',tf('so',$(lastPr),dd));
    // Full daily history (Aug 2017 to now) loads in the background: the chart click panel and the
    // 200-week MA need it, so the page re-renders once it lands.
    fetchAllHistory().then(()=>{if(allDailyCloses.length>0){document.getElementById('ch1').style.cursor='crosshair';updateUI()}});
  } else {
    // Offline: try stored data
    try{const stored=JSON.parse(localStorage.getItem(SK));
      if(stored){c4Pre=stored.pre||[];c4PostW=stored.postW||[];c4PostD=stored.postD||[];lastPr=stored.lastPrice||71000;
        ss('err',tf('sx',$(lastPr)))}
      else{ss('err',t('sn'))}
    }catch(e){ss('err',t('sn'))}
  }
  updateUI();rebuild();
})();
